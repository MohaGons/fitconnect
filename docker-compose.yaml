version: "3.8"

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nest-api-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=fitness_platform_db
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=fitness_platform_db
      - KEYCLOAK_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=MY-REALM
      - KEYCLOAK_ADMIN_CLIENT_ID=admin-cli
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_ADMIN_CLIENT_SECRET=ObkISiWU00ydpPjjmTpL9lvOkrJAWlzy
      - JWT_SECRET=your_jwt_secret_key_here
      - JWT_EXPIRATION=1d
      - PORT=3000
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=5242880
      - MAIL_HOST=smtp.example.com
      - MAIL_PORT=587
      - MAIL_USER=user@example.com
      - MAIL_PASSWORD=mail_password
      - MAIL_FROM=noreply@fitnessplatform.com
      - STRIPE_SECRET_KEY=sk_test_51MfRFGCMBvQfTrL5rqhekc6Sye3reRZNvQNoM0Q6u6nbrXIIuyfEQ0DE9ZoECeZ7BooRHFwDawty3eCA2OMH33IL00r1cje0gN
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: react-app
    working_dir: /usr/src/app
    command: >
      sh -c "npm install --force && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/usr/src/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=fitness_platform_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app-network

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: always
    ports:
      - "3002:3001"
    volumes:
      - ./uptime-kuma:/app/uptime-kuma
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: start-dev --features=preview --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8081:8080"
    depends_on:
      - db
    volumes:
      - ./realm-export:/opt/keycloak/data/import
      - ./keycloak-theme/mytheme:/opt/keycloak/themes/mytheme 
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge