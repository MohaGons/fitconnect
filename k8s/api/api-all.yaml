# Deployment API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: annual-project
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Init container pour attendre PostgreSQL
      initContainers:
      - name: wait-for-postgres
        image: postgres:14
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres-service -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: api
        image: europe-west1-docker.pkg.dev/k8s-frist-test/annual-project-repo/api:latest
        ports:
        - containerPort: 3000
        env:
        # Variables from ConfigMap (existantes + nouvelles)
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: NODE_ENV
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DATABASE_NAME
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: PORT
        - name: JWT_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: JWT_EXPIRATION
        - name: UPLOAD_DIR
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: UPLOAD_DIR
        - name: MAX_FILE_SIZE
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: MAX_FILE_SIZE
        - name: MAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: MAIL_HOST
        - name: MAIL_PORT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: MAIL_PORT
        - name: MAIL_USER
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: MAIL_USER
        - name: MAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: MAIL_FROM
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: KEYCLOAK_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_ADMIN_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: KEYCLOAK_ADMIN_CLIENT_ID
        - name: KEYCLOAK_ADMIN_USERNAME
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: KEYCLOAK_ADMIN_USERNAME
        
        # Variables from existing postgres-secret
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        
        # Variables from new api-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: JWT_SECRET
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: MAIL_PASSWORD
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: KEYCLOAK_ADMIN_CLIENT_SECRET
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: STRIPE_SECRET_KEY
        
        # Variables pour compatibilité avec votre .env (mapping des noms)
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DATABASE_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DATABASE_PORT
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DATABASE_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        
        # Volume pour les uploads
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        
        # Health checks améliorés
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Resources augmentées pour gérer toutes les fonctionnalités
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      
      volumes:
      - name: uploads
        emptyDir: {}
---
# Service API (inchangé)
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: annual-project
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP