apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: annual-project
  labels:
    app: keycloak
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:14
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres-service -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          echo "PostgreSQL is ready!"

      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.3
        args:
        - "start"
        - "--import-realm"
        - "--proxy=edge"
        ports:
        - containerPort: 8080
          name: http

        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN_PASSWORD

        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://postgres-service:5432/fitness_platform_db"
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD

        # Configuration HTTPS via proxy GCP
        - name: KC_HTTP_ENABLED
          value: "false"
        - name: KC_PROXY
          value: "edge"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"

        - name: KC_HOSTNAME
          value: "login.fitnessconnect.fr"
        - name: KC_HOSTNAME_URL
          value: "https://login.fitnessconnect.fr"
        - name: KC_HOSTNAME_ADMIN_URL
          value: "https://login.fitnessconnect.fr"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "false"
        - name: KC_HOSTNAME_STRICT_BACKCHANNEL
          value: "false"

        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI
          value: "true"

        volumeMounts:
        - name: keycloak-theme-volume
          mountPath: /opt/keycloak/themes
        - name: realm-export-volume
          mountPath: /opt/keycloak/data/import

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5

        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "150m"

      volumes:
      - name: keycloak-theme-volume
        persistentVolumeClaim:
          claimName: keycloak-theme-pvc
      - name: realm-export-volume
        persistentVolumeClaim:
          claimName: realm-export-pvc
