apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: annual-project
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.3
        args:
          - "start-dev"
        ports:
          - containerPort: 8080
            name: http
        env:
          - name: KEYCLOAK_ADMIN
            valueFrom:
              secretKeyRef:
                name: keycloak-secret
                key: KEYCLOAK_ADMIN
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-secret
                key: KEYCLOAK_ADMIN_PASSWORD
          - name: KC_HTTP_ENABLED
            value: "true"
          - name: KC_HOSTNAME
            value: "login.fitnessconnect.fr"
          - name: KC_HOSTNAME_URL
            value: "https://login.fitnessconnect.fr"
          - name: KC_HOSTNAME_ADMIN_URL
            value: "https://login.fitnessconnect.fr"
          - name: KC_HEALTH_ENABLED
            value: "true"
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "300m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
