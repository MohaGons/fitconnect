apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: annual-project
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://postgres-service:5432/fitness_platform_db"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_HTTP_ENABLED: "true"
  KC_PROXY: "edge"  # Changé de "none" à "edge" pour support HTTPS via proxy
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: "34.79.140.130"  # Ajouté votre IP externe
  KC_HOSTNAME_ADMIN: "34.79.140.130"  # Ajouté pour l'admin console

---
# Secret pour Keycloak
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: annual-project
type: Opaque
data:
  KEYCLOAK_ADMIN: YWRtaW4=
  KEYCLOAK_ADMIN_PASSWORD: YWRtaW4=

---
# PersistentVolumeClaim pour keycloak-theme
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-theme-pvc
  namespace: annual-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard-rwo

---
# PersistentVolumeClaim pour realm-export
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: realm-export-pvc
  namespace: annual-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard-rwo

---
# Deployment Keycloak modifié pour HTTPS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: annual-project
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      # Init container pour attendre PostgreSQL
      - name: wait-for-postgres
        image: postgres:14
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres-service -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.3
        args:
        - "start"  # Changé de "start-dev" à "start" pour mode production
        - "--optimized"  # Ajouté pour de meilleures performances
        - "--import-realm"
        - "--hostname-strict=false"  # Arguments directs pour plus de fiabilité
        - "--hostname-strict-https=false"
        - "--http-enabled=true"
        - "--proxy=edge"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KC_DB
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME
        - name: KC_HOSTNAME_ADMIN
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME_ADMIN
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HOSTNAME_STRICT_HTTPS
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME_STRICT_HTTPS
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HTTP_ENABLED
        - name: KC_PROXY
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_PROXY
        - name: KC_HEALTH_ENABLED
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HEALTH_ENABLED
        # Variables supplémentaires pour résoudre les problèmes de cookies
        - name: KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI
          value: "true"
        - name: KC_HOSTNAME_STRICT_BACKCHANNEL
          value: "false"
        volumeMounts:
        - name: keycloak-theme-volume
          mountPath: /opt/keycloak/themes
        - name: realm-export-volume
          mountPath: /opt/keycloak/data/import
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"     
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: keycloak-theme-volume
        persistentVolumeClaim:
          claimName: keycloak-theme-pvc
      - name: realm-export-volume
        persistentVolumeClaim:
          claimName: realm-export-pvc

---
# Service Keycloak avec support HTTPS
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: annual-project
  labels:
    app: keycloak
  annotations:
    cloud.google.com/load-balancer-type: "External"
    service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8443
    targetPort: 8080  # Le proxy GCP gère HTTPS et forward en HTTP
    protocol: TCP
    name: https
  type: LoadBalancer

---
# BackendConfig pour optimiser le Load Balancer GCP (optionnel)
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak-backend-config
  namespace: annual-project
spec:
  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health/ready
    port: 8080
  sessionAffinity:
    affinityType: "CLIENT_IP"
    affinityCookieTtlSec: 3600