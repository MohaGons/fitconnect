apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: annual-project
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://postgres-service:5432/fitness_platform_db"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_HTTP_ENABLED: "true"
  KC_PROXY: "edge"
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: "keycloak.34.79.140.130.nip.io"
  KC_HOSTNAME_ADMIN: "keycloak.34.79.140.130.nip.io"

---
# Secret pour Keycloak
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: annual-project
type: Opaque
data:
  KEYCLOAK_ADMIN: YWRtaW4=
  KEYCLOAK_ADMIN_PASSWORD: YWRtaW4=

---
# PersistentVolumeClaim pour keycloak-theme
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-theme-pvc
  namespace: annual-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard-rwo

---
# PersistentVolumeClaim pour realm-export
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: realm-export-pvc
  namespace: annual-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard-rwo

---
# Deployment Keycloak corrigé pour production HTTPS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: annual-project
  labels:
    app: keycloak
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      # Init container pour attendre PostgreSQL
      - name: wait-for-postgres
        image: postgres:14
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres-service -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.3
        args:
        - "start"  
        - "--import-realm"
        - "--proxy=edge"
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://postgres-service:5432/fitness_platform_db"
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        
        # ===== CONFIGURATION HTTPS VIA PROXY =====
        - name: KC_HOSTNAME
          value: "keycloak.34.79.140.130.nip.io"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY
          value: "edge"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HEALTH_ENABLED
          value: "true"
        
        # ===== URLs HTTPS COMPLÈTES =====
        - name: KC_HOSTNAME_URL
          value: "https://keycloak.34.79.140.130.nip.io"
        - name: KC_HOSTNAME_ADMIN_URL
          value: "https://keycloak.34.79.140.130.nip.io"
        
        # ===== CONFIGURATION POUR COOKIES SÉCURISÉS =====
        - name: KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI
          value: "true"
        - name: KC_HOSTNAME_STRICT_BACKCHANNEL
          value: "false"
        
        volumeMounts:
        - name: keycloak-theme-volume
          mountPath: /opt/keycloak/themes
        - name: realm-export-volume
          mountPath: /opt/keycloak/data/import
        
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "150m"
      
      volumes:
      - name: keycloak-theme-volume
        persistentVolumeClaim:
          claimName: keycloak-theme-pvc
      - name: realm-export-volume
        persistentVolumeClaim:
          claimName: realm-export-pvc

---
# Service ClusterIP pour Ingress
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: annual-project
  labels:
    app: keycloak
  annotations:
    cloud.google.com/backend-config: '{"default": "keycloak-backend-config"}'
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP

---
# Service LoadBalancer de backup (gardé pour compatibilité)
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service-lb
  namespace: annual-project
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: LoadBalancer

---
# BackendConfig pour optimiser le Load Balancer GCP
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak-backend-config
  namespace: annual-project
spec:
  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health/ready
    port: 8080
  sessionAffinity:
    affinityType: "CLIENT_IP"
    affinityCookieTtlSec: 3600

---
# ManagedCertificate pour SSL automatique
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: keycloak-ssl-cert
  namespace: annual-project
spec:
  domains:
  - keycloak.34.79.140.130.nip.io

---
# Ingress pour HTTPS avec certificat géré
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: annual-project
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: "keycloak-ssl-cert"
    ingress.gcp.kubernetes.io/load-balancer-type: "External"
spec:
  rules:
  - host: keycloak.34.79.140.130.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080